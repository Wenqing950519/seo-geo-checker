<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" width="100%" height="100%">
  <defs>
    <!-- Background Squircle Container Gradient -->
    <linearGradient id="fav-bg" x1="64" y1="0" x2="64" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111B33" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#060C18" />
    </linearGradient>

    <!-- App Icon Specular Border -->
    <linearGradient id="fav-border" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8B7CF6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0B1F3B" stop-opacity="0.2" />
    </linearGradient>

    <!-- Monogram Gradients -->
    <linearGradient id="fav-gradL" x1="250" y1="180" x2="420" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="0.28" stop-color="#2459A9"/>
      <stop offset="0.62" stop-color="#17355F"/>
      <stop offset="1" stop-color="#0B1F3B"/>
    </linearGradient>

    <linearGradient id="fav-gradBottom" x1="290" y1="710" x2="700" y2="790" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1F3B"/>
      <stop offset="0.48" stop-color="#24466F"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="fav-gradS" x1="430" y1="270" x2="770" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1F3B"/>
      <stop offset="0.34" stop-color="#213E67"/>
      <stop offset="0.58" stop-color="#3B82F6"/>
      <stop offset="0.78" stop-color="#1F4E98"/>
      <stop offset="1" stop-color="#0B1F3B"/>
    </linearGradient>

    <linearGradient id="fav-gradAccent" x1="650" y1="250" x2="815" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="0.52" stop-color="#5A78F8"/>
      <stop offset="1" stop-color="#8B7CF6"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="3" y="3" width="122" height="122" rx="30" fill="url(#fav-bg)" stroke="url(#fav-border)" stroke-width="2" />

  <!-- Centered LS Monogram -->
  <g transform="translate(64, 64) scale(0.14) translate(-524, -520)">
    <path d="M235 300 L345 210 L345 650 C345 680 356 699 372 714 L255 810 L235 830 Z" fill="url(#fav-gradL)"/>
    <path d="M267 829 L385 730 H695 C700 774 682 807 654 829 H267 Z" fill="url(#fav-gradBottom)"/>
    <path d="M455 255 H637 L582 330 H507 C467 330 443 350 443 379 C443 409 465 425 500 438 L650 495 C726 524 772 569 776 630 C780 690 752 742 692 782 C670 797 646 806 619 812 C667 775 686 739 684 701 C682 660 654 635 607 617 L480 569 C393 536 356 482 356 416 C356 328 394 274 455 255 Z" fill="url(#fav-gradS)"/>
    <path d="M662 255 H813 L760 330 H610 Z" fill="url(#fav-gradAccent)"/>
  </g>
</svg>
