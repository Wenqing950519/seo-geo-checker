<svg
  width="800"
  height="500"
  viewBox="0 0 800 500"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="chart-title chart-desc"
>
  <title id="chart-title">AI 信任值：答案採用 vs. 來源證據判定四象限</title>
  <desc id="chart-desc">
    X 軸為第一方官網引用率，權重 35%；Y 軸為可見答案採用率，權重 65%。
    四象限依序為完全採信、二次提及、未可觀測與背景引用。
  </desc>

  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow
        dx="0"
        dy="4"
        stdDeviation="6"
        flood-color="#0B3B6F"
        flood-opacity="0.07"
      />
    </filter>

    <marker
      id="arrowNavy"
      markerWidth="8"
      markerHeight="8"
      refX="6"
      refY="4"
      orient="auto"
      markerUnits="strokeWidth"
    >
      <path d="M0 0L8 4L0 8Z" fill="#0B3B6F"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="18" fill="#F9FBFC"/>

  <!-- Title -->
  <text
    x="400"
    y="34"
    text-anchor="middle"
    font-family="sans-serif"
    font-size="20"
    font-weight="700"
    fill="#0B3B6F"
  >
    AI 信任值：答案採用 vs. 來源證據判定四象限
  </text>

  <!-- Plot area subtle background -->
  <rect
    x="126"
    y="66"
    width="610"
    height="350"
    rx="14"
    fill="#FFFFFF"
    stroke="#DCE7EF"
  />

  <!-- Quadrant background areas -->
  <rect
    x="136"
    y="76"
    width="290"
    height="160"
    rx="14"
    fill="#F5F8FB"
  />
  <rect
    x="436"
    y="76"
    width="290"
    height="160"
    rx="14"
    fill="#E8F9F6"
    stroke="#00B8A9"
    stroke-opacity="0.32"
  />
  <rect
    x="136"
    y="246"
    width="290"
    height="160"
    rx="14"
    fill="#F5F8FB"
  />
  <rect
    x="436"
    y="246"
    width="290"
    height="160"
    rx="14"
    fill="#F2F7FA"
  />

