  <text
    x="431"
    y="441"
    text-anchor="middle"
    font-family="sans-serif"
    font-size="11"
    fill="#0B3B6F"
  >50%</text>

  <text
    x="736"
    y="441"
    text-anchor="middle"
    font-family="sans-serif"
    font-size="11"
    fill="#0B3B6F"
  >100%</text>

  <!-- Y ticks -->
  <line x1="119" y1="416" x2="126" y2="416" stroke="#0B3B6F" stroke-width="1.5"/>
  <line x1="119" y1="241" x2="126" y2="241" stroke="#0B3B6F" stroke-width="1.5"/>
  <line x1="119" y1="66" x2="126" y2="66" stroke="#0B3B6F" stroke-width="1.5"/>

  <text
    x="108"
    y="420"
    text-anchor="end"
    font-family="sans-serif"
    font-size="11"
    fill="#0B3B6F"
