  <!-- Y-axis label -->
  <g transform="translate(33 241) rotate(-90)">
    <text
      x="0"
      y="0"
      text-anchor="middle"
      font-family="sans-serif"
      font-size="14"
      font-weight="700"
      fill="#0B3B6F"
