  <line
    x1="136"
    y1="241"
    x2="726"
    y2="241"
    stroke="#0B3B6F"
    stroke-opacity="0.14"
    stroke-width="1.5"
    stroke-dasharray="5 6"
  />

  <!-- Q2: 二次提及 -->
  <g filter="url(#cardShadow)">
    <rect
      x="158"
      y="101"
      width="246"
      height="110"
      rx="12"
      fill="#FFFFFF"
      stroke="#DCE7EF"
