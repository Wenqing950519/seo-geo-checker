    <rect
      x="64"
      y="-17"
      width="74"
      height="23"
      rx="11.5"
      fill="#E5F8F5"
    />
    <text
      x="101"
      y="-1"
      text-anchor="middle"
      font-family="sans-serif"
      font-size="11"
      font-weight="700"
      fill="#008F83"
