  <line x1="126" y1="416" x2="126" y2="423" stroke="#0B3B6F" stroke-width="1.5"/>
  <line x1="431" y1="416" x2="431" y2="423" stroke="#0B3B6F" stroke-width="1.5"/>
  <line x1="736" y1="416" x2="736" y2="423" stroke="#0B3B6F" stroke-width="1.5"/>

  <text
