    第一方官網引用率
  </text>

  <rect
    x="523"
    y="451"
    width="74"
    height="23"
    rx="11.5"
    fill="#E5F8F5"
  />
  <text
    x="560"
    y="467"
    text-anchor="middle"
    font-family="sans-serif"
    font-size="11"
    font-weight="700"
    fill="#008F83"
