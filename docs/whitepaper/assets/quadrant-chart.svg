    最佳實證
  </text>

  <!-- Q3: 未可觀測 -->
  <g filter="url(#cardShadow)">
    <rect
      x="158"
      y="271"
      width="246"
      height="110"
      rx="12"
      fill="#FFFFFF"
      stroke="#DCE7EF"
    />
  </g>

  <rect
    x="176"
    y="288"
    width="88"
    height="25"
    rx="12.5"
    fill="#EDF2F6"
  />
  <text
    x="220"
    y="305"
    text-anchor="middle"
    font-family="sans-serif"
    font-size="12"
    font-weight="700"
    fill="#60758A"
